name: Buffer queue cleanup

# Lists the UNSENT Buffer posts whose text contains the given phrase. Deletes them only when `delete` is
# ticked. Sent posts are never selected, the phrase must be 15+ characters, and at most 10 posts are deleted.
on:
  workflow_dispatch:
    inputs:
      match:
        description: "Text the posts to remove contain (15+ characters)"
        required: true
        type: string
      delete:
        description: "Tick to actually delete (unticked = dry run that only lists)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LOG_LEVEL: WARNING
      DATABASE_PATH: ":memory:"
      OPENCODE_COMMAND: opencode
      INSTAGRAM_ENABLED: "false"
      IMAGE_PROVIDER: local
      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
      BUFFER_PROFILE_ID: ${{ secrets.BUFFER_PROFILE_ID }}
      MATCH: ${{ github.event.inputs.match }}
      DELETE: ${{ github.event.inputs.delete }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install
        run: python -m pip install -e .
      - name: List or delete
        run: |
          set -o pipefail
          flags=""
          if [ "$DELETE" = "true" ]; then flags="--yes"; fi
          python -m ai_content_agent.cli buffer-delete --match "$MATCH" $flags | tee -a "$GITHUB_STEP_SUMMARY"
