name: Monthly report

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

concurrency:
  group: repo-state
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monthly:
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: INFO
      DATABASE_PATH: agent.db
      OPENCODE_COMMAND: opencode
      INSTAGRAM_ENABLED: "true"
      IMAGE_PROVIDER: ${{ secrets.IMAGE_PROVIDER }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      NOTIFY_CHANNELS: ${{ secrets.NOTIFY_CHANNELS }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: opencode-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            opencode-${{ runner.os }}-
      - name: Install opencode
        run: npm install -g opencode-ai

      - name: Add npm global bin to PATH
        run: echo "$(npm config get prefix)/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run monthly report
        run: |
          set -o pipefail
          python -m ai_content_agent.cli monthly 2>&1 | while IFS= read -r line; do
            echo "::notice::$line"
            echo "$line"
          done
