name: Daily content run

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: repo-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: INFO
      DATABASE_PATH: agent.db
      OPENCODE_COMMAND: opencode
      OPENCODE_TIMEOUT_SECONDS: "1200"
      INSTAGRAM_ENABLED: "true"
      IMAGE_PROVIDER: ${{ secrets.IMAGE_PROVIDER }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      INSTAGRAM_API_VERSION: ${{ secrets.INSTAGRAM_API_VERSION }}
      INSTAGRAM_PUBLISH_ENABLED: ${{ secrets.INSTAGRAM_PUBLISH_ENABLED }}
      INSTAGRAM_ANALYTICS_ENABLED: ${{ secrets.INSTAGRAM_ANALYTICS_ENABLED }}
      MEDIA_HOST: ${{ secrets.MEDIA_HOST }}
      MEDIA_HOST_REPO: ${{ secrets.MEDIA_HOST_REPO }}
      MEDIA_HOST_TOKEN: ${{ secrets.MEDIA_HOST_TOKEN }}
      MEDIA_HOST_BRANCH: ${{ secrets.MEDIA_HOST_BRANCH }}
      MEDIA_HOST_PATH: ${{ secrets.MEDIA_HOST_PATH }}
      NOTIFY_CHANNELS: ${{ secrets.NOTIFY_CHANNELS }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: opencode-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            opencode-${{ runner.os }}-
      - name: Install opencode
        run: npm install -g opencode-ai

      - name: Add npm global bin to PATH
        run: echo "$(npm config get prefix)/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run daily pipeline
        run: |
          set -o pipefail
          python -m ai_content_agent.cli daily 2>&1 | while IFS= read -r line; do
            echo "::notice::$line"
            echo "$line"
          done
      - name: Show post kit in job summary
        if: ${{ !cancelled() }}
        run: |
          kit=$(ls -t posts/post_kit_*.md 2>/dev/null | head -n 1 || true)
          if [ -n "$kit" ]; then cat "$kit" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Generate prompt viewer
        run: python -m ai_content_agent.cli prompts
      - name: Upload prompt logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-prompts-${{ github.run_id }}
          path: logs/prompts/
          if-no-files-found: ignore
      - name: Persist artifacts
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for path in agent.db brain/strategy.md; do
            if [ -e "$path" ]; then git add -f "$path"; fi
          done
          for dir in posts images; do
            if [ -d "$dir" ]; then git add -f "$dir"; fi
          done
          git commit -m "chore: daily run artifacts" || echo "No changes to commit"
          git push
