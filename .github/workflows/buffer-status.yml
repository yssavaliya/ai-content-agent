name: Buffer queue status

# Read-only: lists the posts Buffer holds for the configured channel (status, share mode, send time) in the
# job summary, so a full or stuck queue can be diagnosed. It never creates, edits or deletes anything.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LOG_LEVEL: WARNING
      DATABASE_PATH: ":memory:"
      OPENCODE_COMMAND: opencode
      INSTAGRAM_ENABLED: "false"
      IMAGE_PROVIDER: local
      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
      BUFFER_PROFILE_ID: ${{ secrets.BUFFER_PROFILE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install
        run: python -m pip install -e .
      - name: List Buffer posts
        run: |
          set -o pipefail
          python -m ai_content_agent.cli buffer-status --markdown | tee -a "$GITHUB_STEP_SUMMARY"
