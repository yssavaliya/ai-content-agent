name: LLM provider check

# Pings every provider in the chain once and prints a status table in the job summary.
# Fails only when NO provider answers (the pipeline would then use local templates only).
on:
  workflow_dispatch:
    inputs:
      chain:
        description: "Providers to test (comma separated). Leave empty for the default free chain."
        required: false
        default: ""
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LOG_LEVEL: WARNING
      DATABASE_PATH: ":memory:"
      OPENCODE_COMMAND: opencode
      INSTAGRAM_ENABLED: "false"
      IMAGE_PROVIDER: local
      LLM_CHAIN: ${{ github.event.inputs.chain || secrets.LLM_CHAIN || vars.LLM_CHAIN || 'groq,gemini,cloudflare,openrouter,pollinations' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_MODEL: ${{ secrets.CLOUDFLARE_MODEL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install
        run: python -m pip install -e .
      - name: Ping providers
        run: |
          set -o pipefail
          python -m ai_content_agent.cli llm-check --markdown | tee -a "$GITHUB_STEP_SUMMARY"
