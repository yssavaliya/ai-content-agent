name: Analytics collection

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: INFO
      DATABASE_PATH: agent.db
      OPENCODE_COMMAND: opencode
      INSTAGRAM_ENABLED: "false"
      IMAGE_PROVIDER: ${{ secrets.IMAGE_PROVIDER }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      INSTAGRAM_ANALYTICS_ENABLED: ${{ secrets.INSTAGRAM_ANALYTICS_ENABLED }}
      NOTIFY_CHANNELS: ${{ secrets.NOTIFY_CHANNELS }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: opencode-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            opencode-${{ runner.os }}-
      - name: Install opencode
        run: npm install -g opencode-ai
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Collect analytics
        run: |
          python -m ai_content_agent.cli analytics 2>&1 | while IFS= read -r line; do
            echo "::notice::$line"
            echo "$line"
          done
      - name: Persist artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f agent.db
          git commit -m "chore: analytics artifacts" || echo "No changes to commit"
          git push
