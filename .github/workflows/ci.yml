name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Complete Validation Pipeline
    runs-on: ubuntu-latest
    env:
      AGENT_RETRY_BACKOFF_SECONDS: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Validate configuration handling
        run: |
          python -m ai_content_agent.cli --help
          python -m ai_content_agent.cli help
          # Verify clean error handling when required env variables are absent
          output=$(python -m ai_content_agent.cli daily 2>&1 || true)
          echo "$output" | grep -q "Missing required configuration values"
          ! echo "$output" | grep -q "Traceback"

      - name: Lint & static analysis (ruff)
        run: |
          python -m ruff check .
          python -m ruff check ai-anime-agent

      - name: Database migrations on clean test database
        run: |
          python -c "from ai_content_agent.database.connection import initialize_database, run_migrations; initialize_database('test_validation.db'); run_migrations('test_validation.db')"
          rm -f test_validation.db

      - name: Unit tests
        run: |
          python -m pytest tests -q --ignore=tests/test_e2e_workflows.py --ignore=tests/test_browser_e2e.py

      - name: Real anime metadata retrieval (Kitsu API)
        run: |
          python -m ai_content_agent.cli anime-trends

      - name: Real anime concept & story generation
        run: |
          python -m ai_content_agent.cli anime-concept "Cybernetic Vedic Warriors in Year 3000"

      - name: Genuine visual media generation & verification
        run: |
          python -c "
          from ai_content_agent.providers.image.pillow_provider import PillowImageProvider
          from ai_content_agent.providers.image.base import ImageRequest
          from ai_content_agent.publish.hosting import convert_to_jpeg
          from pathlib import Path
          from PIL import Image

          provider = PillowImageProvider()
          req = ImageRequest(
              prompt='Masterpiece anime key visual for Cybernetic Vedic Warriors, glowing neon, cinematic composition',
              brand_style='clean',
              aspect_ratio='1:1'
          )
          res = provider.generate(req)
          print('Generated artwork:', res.file_path)

          assert Path(res.file_path).exists(), 'Output image file does not exist'
          assert Path(res.file_path).stat().st_size > 15000, 'Image file size too small'

          with Image.open(res.file_path) as img:
              assert img.format == 'PNG', f'Expected PNG format, got {img.format}'
              assert img.size == (1080, 1080), f'Expected 1080x1080, got {img.size}'
              assert img.mode == 'RGB', f'Expected RGB, got {img.mode}'
              print(f'Verified PNG: size={img.size}, mode={img.mode}, bytes={Path(res.file_path).stat().st_size}')

          jpeg_path = convert_to_jpeg(res.file_path, 'images/jpeg/ci_verified_artwork.jpg')
          assert Path(jpeg_path).exists(), 'Converted JPEG does not exist'
          with Image.open(jpeg_path) as j_img:
              assert j_img.format == 'JPEG'
              assert j_img.size == (1080, 1080)
              print(f'Verified JPEG conversion: {jpeg_path} ({Path(jpeg_path).stat().st_size} bytes)')
          "

      - name: End-to-end real user workflow tests
        run: python -m pytest tests/test_e2e_workflows.py -v

      - name: Browser-based end-to-end tests (Playwright)
        run: python -m pytest tests/test_browser_e2e.py -v

      - name: Subproject tests (ai-anime-agent)
        run: |
          cd ai-anime-agent
          python -m pip install -e ".[dev]"
          python -m pytest -v
          cd ..

      - name: Real execution mode & prompt viewer generation
        run: |
          python -m ai_content_agent.cli prompts
          test -f logs/prompts/index.html

      - name: Upload test artifacts & diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-artifacts-${{ github.run_id }}
          path: |
            reports/
            logs/
            posts/
            images/
          if-no-files-found: ignore

