[project]
name = "ai-content-agent"
version = "0.1.0"
description = "Autonomous AI Content Agent for researching trends, planning ideas, creating Instagram drafts, publishing to Instagram, collecting analytics, and running a Scientist learning loop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.55.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
ai-content-agent = "ai_content_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
